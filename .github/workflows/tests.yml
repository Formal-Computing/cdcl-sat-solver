name: Native solver tests

on:
  pull_request:
  push:
    branches:
      - main
      - "air/**"

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install differential-test oracle
        run: python -m pip install z3-solver
      - name: Configure (assertions enabled)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel 2
      - name: Native and GUI unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Differential test against Z3
        run: python tests/qflia_differential.py --cases 300
